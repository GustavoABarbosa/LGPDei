name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApiLGPDei
    env:
      # Match docker-compose Mongo credentials used by tests/conftest.py defaults.
      TEST_MONGODB_URI: mongodb://lgpdei:change-me-strong-password@127.0.0.1:27017/lgpdei_test?authSource=admin
      MONGODB_URI: mongodb://lgpdei:change-me-strong-password@127.0.0.1:27017/lgpdei_test?authSource=admin
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      ANTHROPIC_API_KEY: test-key
      COOKIE_SECURE: "false"
      APP_ENV: test
      PII_MODE: off
    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: lgpdei
          MONGO_INITDB_ROOT_PASSWORD: change-me-strong-password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh -u lgpdei -p change-me-strong-password --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: docker build -t lgpdei-api .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebLGPDei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: WebLGPDei/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: docker build -t lgpdei-web .

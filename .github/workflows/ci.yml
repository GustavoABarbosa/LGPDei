name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApiLGPDei
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: docker build -t lgpdei-api .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebLGPDei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: WebLGPDei/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: docker build -t lgpdei-web .

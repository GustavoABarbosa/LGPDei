# Credentials come from ./.env (see .env.example). MongoDB is only reachable inside the compose network;
# for local development outside containers, add docker-compose.dev.yml to expose it on 127.0.0.1.
services:
  mongo:
    image: mongo:7
    container_name: lgpdei-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - lgpdei_mongo_data:/data/db

  # Full stack in containers: docker compose --profile app up --build
  api:
    profiles: ["app"]
    build: ./ApiLGPDei
    env_file: ./ApiLGPDei/.env
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/lgpdei?authSource=admin
    ports:
      - "3334:3334"
    depends_on:
      - mongo

  web:
    profiles: ["app"]
    build:
      context: ./WebLGPDei
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:3334/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  lgpdei_mongo_data:
